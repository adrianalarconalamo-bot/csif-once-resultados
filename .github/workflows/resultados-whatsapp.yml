name: Enviar Resultados ONCE por WhatsApp

on:
  workflow_dispatch:

  schedule:
    # Comprobaciones cada 5 minutos (UTC).
    # El script controla la hora española (no envía antes de 21:30).
    - cron: "30-55/5 19 * * *"
    - cron: "*/5 20-23 * * *"

jobs:

  whatsapp:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generar resultados ONCE
        run: |
          python generar_resultados.py

      - name: Comprobar y enviar por WhatsApp
        env:
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
        run: |
          python enviar_whatsapp.py

      - name: Guardar estado WhatsApp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            resultados.json \
            whatsapp.txt \
            whatsapp_enviado.json \
            historial_cupones.json || true

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualizar resultados y estado WhatsApp ONCE"
            git push
          fi
