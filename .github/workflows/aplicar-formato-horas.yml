name: Aplicar formato CSIF horas

on:
  workflow_dispatch:

jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar base y aplicar horas
        run: |
          git checkout 8526b9a41677c9633e87724a69306127c6bcc7e1 -- generar_whatsapp.py enviar_whatsapp.py
          python3 patch_horas.py

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generar_whatsapp.py enviar_whatsapp.py
          git status
          git commit -m "Formato CSIF con horas de sorteos (10:00-21:15)" || echo "sin cambios"
          git push
