name: Resultados ONCE (Telegram + WhatsApp)

on:
  workflow_dispatch:

  schedule:
    # Ventana crítica ampliada y más densa (hora UTC)
    # 19:00-19:55 UTC = 21:00-21:55 CEST  (cada 5 min)
    # 20:00-23:55 UTC = 22:00-01:55 CEST  (cada 5 min)
    # Así aumentamos mucho la probabilidad de que GitHub lo lance a tiempo
    - cron: "*/5 19 * * *"
    - cron: "*/5 20-23 * * *"

jobs:

  resultados:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      # -------------------------------------------------------
      # GENERAR RESULTADOS (nunca falla en rojo por "aún no hay datos")
      # -------------------------------------------------------
      - name: Generar resultados ONCE
        id: generar
        run: |
          set +e
          python generar_resultados.py
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "ERROR real en el scraper (código $code)"
            exit $code
          fi

      - name: Comprobar si hay resultados de hoy
        id: check
        run: |
          python - <<'PY'
          import json, os, sys
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          ahora = datetime.now(ZoneInfo("Europe/Madrid"))
          hoy = ahora.strftime("%d/%m/%Y")
          ayer = (ahora.date() - timedelta(days=1)).strftime("%d/%m/%Y")
          permitir_ayer = ahora.hour < 3

          if not os.path.exists("resultados.json"):
              print("No existe resultados.json → skip")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("listo=false\n")
              sys.exit(0)

          with open("resultados.json", encoding="utf-8") as f:
              datos = json.load(f)
          resultados = datos.get("resultados", [])

          de_hoy = [r for r in resultados if hoy in str(r.get("fecha", ""))]
          de_ayer = [r for r in resultados if ayer in str(r.get("fecha", ""))] if permitir_ayer else []

          print(f"Resultados de hoy ({hoy}): {len(de_hoy)}")
          if permitir_ayer:
              print(f"Resultados de ayer ({ayer}) [madrugada]: {len(de_ayer)}")

          listo = "true" if (de_hoy or de_ayer) else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"listo={listo}\n")
          PY

      - name: Calcular demoras
        if: steps.check.outputs.listo == 'true'
        run: python calcular_demoras.py

      - name: Mostrar demoras
        if: steps.check.outputs.listo == 'true'
        run: |
          echo "========================================"
          echo "       DEMORAS GENERADAS"
          echo "========================================"
          cat demoras_texto.txt || true
          echo "========================================"

      # -------------------------------------------------------
      # TELEGRAM (formato original)
      # -------------------------------------------------------
      - name: Enviar resultados a Telegram
        if: steps.check.outputs.listo == 'true'
        id: telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python generar_whatsapp.py

      - name: Enviar informe de demoras a Telegram
        if: steps.check.outputs.listo == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, json, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import requests

          try:
              with open("telegram_enviado.json", encoding="utf-8") as f:
                  estado = json.load(f)
          except FileNotFoundError:
              print("Los resultados todavía no han sido enviados a Telegram.")
              sys.exit(0)

          fecha_ref = (estado.get("fecha") or "").strip()
          if not fecha_ref:
              print("telegram_enviado.json no tiene fecha. No se envían demoras.")
              sys.exit(0)

          try:
              with open("demoras_enviadas.json", encoding="utf-8") as f:
                  estado_demoras = json.load(f)
          except FileNotFoundError:
              estado_demoras = {}

          if estado_demoras.get("fecha") == fecha_ref:
              print(f"Las demoras de {fecha_ref} ya fueron enviadas a Telegram.")
              sys.exit(0)

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          chat_id = os.getenv("TELEGRAM_CHAT_ID")
          if not token or not chat_id:
              print("Faltan secrets de Telegram")
              sys.exit(0)

          with open("demoras_texto.txt", encoding="utf-8") as f:
              texto = f.read().strip()
          if not texto:
              print("demoras_texto.txt vacío")
              sys.exit(0)

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          respuesta = requests.post(
              url,
              json={"chat_id": chat_id, "text": texto, "disable_web_page_preview": True},
              timeout=15,
          )
          if not respuesta.ok:
              print(f"ERROR Telegram demoras: {respuesta.status_code} - {respuesta.text}")
              sys.exit(1)

          with open("demoras_enviadas.json", "w", encoding="utf-8") as f:
              json.dump({"fecha": fecha_ref}, f, ensure_ascii=False, indent=2)
          print(f"Informe de demoras ({fecha_ref}) enviado correctamente a Telegram.")
          PY

      # -------------------------------------------------------
      # WHATSAPP — MISMO formato que Telegram (partido si hace falta)
      # -------------------------------------------------------
      - name: Enviar resultados a WhatsApp (CallMeBot)
        if: steps.check.outputs.listo == 'true'
        continue-on-error: true
        env:
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
        run: python enviar_whatsapp.py

      # -------------------------------------------------------
      # GUARDAR ESTADO (aunque un canal haya fallado)
      # -------------------------------------------------------
      - name: Guardar resultados y estados
        if: steps.check.outputs.listo == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            resultados.json \
            whatsapp.txt \
            historial_cupones.json \
            demoras_texto.txt \
            demoras_estado.json \
            telegram_enviado.json \
            demoras_enviadas.json \
            whatsapp_enviado.json || true

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualizar resultados, demoras y estados ONCE (Telegram + WhatsApp)"

            for i in 1 2 3 4 5; do
              echo "Intento de push #$i ..."
              if git push; then
                echo "Push correcto."
                exit 0
              fi
              echo "Push rechazado. Haciendo pull --rebase..."
              git pull --rebase origin main || git pull --rebase origin main --autostash
              sleep 2
            done

            echo "ERROR: no se pudo hacer push tras varios reintentos."
            exit 1
          fi
