name: Resultados

on:
  workflow_dispatch:
  schedule:
    # Se ejecuta a las 21:30 (hora peninsular española)
    - cron: "30 19 * * *"

permissions:
  contents: write

jobs:
  resultados:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar generador de resultados
        run: python generar_resultados.py

      - name: Generar texto para WhatsApp / Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python generar_whatsapp.py

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados.json whatsapp.txt
          git diff --cached --quiet || git commit -m "Actualizar resultados"
          git push
