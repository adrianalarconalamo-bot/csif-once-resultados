name: Actualizar Resultados ONCE

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  resultados:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Generar resultados
        run: python generar_resultados.py

      - name: Generar mensaje y enviar a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python generar_whatsapp.py

      - name: Guardar y subir cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados.json whatsapp.txt
          git diff --cached --quiet || git commit -m "Actualizar resultados"
          git push
