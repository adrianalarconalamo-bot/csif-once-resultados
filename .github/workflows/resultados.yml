name: Resultados

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  resultados:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Ejecutar generador de resultados
        run: python generar_resultados.py

      - name: Generar texto para WhatsApp
        run: python generar_whatsapp.py

      - name: Guardar resultados y WhatsApp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados.json whatsapp.txt
          git diff --cached --quiet || git commit -m "Actualizar resultados"
          git push