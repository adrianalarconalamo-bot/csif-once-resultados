name: Actualizar Resultados ONCE

on:
  workflow_dispatch:

  schedule:
    # Comprobaciones cada 5 minutos.
    # GitHub trabaja en UTC.
    #
    # El programa controla internamente la hora española
    # para no enviar antes de las 21:30.
    - cron: "30-55/5 19 * * *"
    - cron: "*/5 20-23 * * *"

jobs:

  resultados:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # =====================================================
      # DESCARGAR REPOSITORIO
      # =====================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4

      # =====================================================
      # CONFIGURAR PYTHON
      # =====================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =====================================================
      # INSTALAR DEPENDENCIAS
      # =====================================================

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      # =====================================================
      # GENERAR RESULTADOS ONCE
      # =====================================================

      - name: Generar resultados ONCE
        run: |
          python generar_resultados.py

      # =====================================================
      # COMPROBAR RESULTADOS
      # =====================================================

      - name: Comprobar resultados
        run: |
          python - <<'PY'
          import json

          with open(
              "resultados.json",
              "r",
              encoding="utf-8"
          ) as f:
              datos = json.load(f)

          resultados = datos.get(
              "resultados",
              []
          )

          print(
              "Resultados encontrados:",
              len(resultados)
          )

          if not resultados:
              raise SystemExit(
                  "ERROR: resultados.json está vacío."
              )

          for resultado in resultados[:50]:

              print(
                  resultado.get("tipo"),
                  "|",
                  resultado.get("fecha"),
                  "|",
                  resultado.get("numero"),
                  "| serie:",
                  resultado.get("serie")
              )
          PY

      # =====================================================
      # CALCULAR DEMORAS
      # =====================================================

      - name: Calcular demoras
        run: |
          python calcular_demoras.py

      # =====================================================
      # COMPROBAR DEMORAS
      # =====================================================

      - name: Comprobar demoras
        run: |
          echo "========================================"
          echo "       DEMORAS GENERADAS"
          echo "========================================"
          echo ""

          cat demoras_texto.txt

          echo ""
          echo "========================================"

      # =====================================================
      # GENERAR Y ENVIAR RESULTADOS
      #
      # Este programa NO envía nada hasta que comprueba
      # que todos los sorteos esperados están disponibles.
      # =====================================================

      - name: Comprobar y enviar resultados CSIF
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python generar_whatsapp.py

      # =====================================================
      # ENVIAR DEMORAS SOLO DESPUÉS DE HABER ENVIADO
      # CORRECTAMENTE LOS RESULTADOS
      # =====================================================

      - name: Enviar informe de demoras
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import requests

          HOY = datetime.now(
              ZoneInfo("Europe/Madrid")
          ).strftime("%d/%m/%Y")

          # -------------------------------------------------
          # COMPROBAR QUE LOS RESULTADOS YA FUERON ENVIADOS
          # -------------------------------------------------

          try:

              with open(
                  "telegram_enviado.json",
                  "r",
                  encoding="utf-8"
              ) as f:
                  estado = json.load(f)

          except FileNotFoundError:

              print(
                  "Los resultados todavía no han sido enviados."
              )
              raise SystemExit(0)

          if estado.get("fecha") != HOY:

              print(
                  "El estado no corresponde al día de hoy."
              )
              raise SystemExit(0)

          # -------------------------------------------------
          # EVITAR DUPLICAR LAS DEMORAS
          # -------------------------------------------------

          try:

              with open(
                  "demoras_enviadas.json",
                  "r",
                  encoding="utf-8"
              ) as f:
                  estado_demoras = json.load(f)

          except FileNotFoundError:

              estado_demoras = {}

          if estado_demoras.get("fecha") == HOY:

              print(
                  "Las demoras de hoy ya fueron enviadas."
              )
              raise SystemExit(0)

          # -------------------------------------------------
          # CREDENCIALES
          # -------------------------------------------------

          token = os.getenv(
              "TELEGRAM_BOT_TOKEN"
          )

          chat_id = os.getenv(
              "TELEGRAM_CHAT_ID"
          )

          if not token or not chat_id:

              raise SystemExit(
                  "ERROR: faltan "
                  "TELEGRAM_BOT_TOKEN "
                  "o TELEGRAM_CHAT_ID"
              )

          # -------------------------------------------------
          # LEER DEMORAS
          # -------------------------------------------------

          with open(
              "demoras_texto.txt",
              "r",
              encoding="utf-8"
          ) as f:
              texto = f.read().strip()

          if not texto:

              raise SystemExit(
                  "ERROR: demoras_texto.txt está vacío."
              )

          # -------------------------------------------------
          # ENVIAR TELEGRAM
          # -------------------------------------------------

          url = (
              "https://api.telegram.org/"
              f"bot{token}/sendMessage"
          )

          respuesta = requests.post(
              url,
              json={
                  "chat_id": chat_id,
                  "text": texto,
                  "disable_web_page_preview": True
              },
              timeout=15
          )

          if not respuesta.ok:

              raise SystemExit(
                  "ERROR Telegram: "
                  f"{respuesta.status_code} - "
                  f"{respuesta.text}"
              )

          # -------------------------------------------------
          # MARCAR DEMORAS COMO ENVIADAS
          # -------------------------------------------------

          with open(
              "demoras_enviadas.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  {
                      "fecha": HOY
                  },
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Informe de demoras enviado correctamente."
          )
          PY

      # =====================================================
      # GUARDAR TODOS LOS ARCHIVOS
      # =====================================================

      - name: Guardar resultados y estado
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            resultados.json \
            whatsapp.txt \
            historial_cupones.json \
            demoras_texto.txt \
            demoras_estado.json \
            telegram_enviado.json \
            demoras_enviadas.json

          if git diff --cached --quiet; then

            echo "No hay cambios que guardar."

          else

            git commit \
              -m "Actualizar resultados, demoras y estados ONCE"

            git push

          fi